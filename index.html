<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好康复</title>
<meta name="description" content="术后康复语音带练：膝关节（前交叉韧带重建）、踝关节（外踝韧带止点重建）。每天自动排好练习，语音带着做。个人制作，免费，不用注册。">
<meta name="theme-color" content="#ECF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="好康复">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}</style>
<script>window.HKF_WEB = '2.0';</script>
</head>
<body>
<style>
/* Layout: one phone-width column. A "now" card on top, the day's 7 rounds as a time rail, a fullscreen voice coach over everything. */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --sunk:#E1E8E4; --ink:#13201A; --muted:#55675E; --line:#D0DBD5;
  --accent:#0A7761; --accent-soft:#D3EBE3; --on-accent:#FFFFFF;
  --now:#A8670D; --now-soft:#F6E7CC;
  --ice:#2569B3; --ice-soft:#DAE7F6;
  --danger:#B3322A; --danger-soft:#F7DEDA;
  /* coach overlay: one deliberate dark look in both themes */
  --p-bg:#0B2B23; --p-panel:#12382F; --p-soft:rgba(255,255,255,.07); --p-ink:#EFF6F2; --p-muted:#9DBFB3; --p-line:rgba(255,255,255,.16);
  --p-amber:#F2B23E; --p-on-amber:#1E1606; --p-go:#4AD3AA; --p-ice:#86BEF5;
  --f-num:"Barlow Condensed","DIN Alternate","DIN Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Noto Sans CJK SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1210; --surface:#131D19; --sunk:#1B2723; --ink:#E2EBE6; --muted:#91A69C; --line:#25332E;
  --accent:#3AC6A0; --accent-soft:#11362D; --on-accent:#03221A;
  --now:#F0B03A; --now-soft:#38290F;
  --ice:#6EAEF0; --ice-soft:#12283E;
  --danger:#FF7E72; --danger-soft:#3A1814;
  --p-bg:#06150F; --p-panel:#0D271F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1210; --surface:#131D19; --sunk:#1B2723; --ink:#E2EBE6; --muted:#91A69C; --line:#25332E;
  --accent:#3AC6A0; --accent-soft:#11362D; --on-accent:#03221A;
  --now:#F0B03A; --now-soft:#38290F;
  --ice:#6EAEF0; --ice-soft:#12283E;
  --danger:#FF7E72; --danger-soft:#3A1814;
  --p-bg:#06150F; --p-panel:#0D271F;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 64px}

/* header */
.hdr{display:grid;gap:10px;padding-top:2px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);text-align:center}
.dayline{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:22px;line-height:1;padding:0 0 3px}
.daytitle{text-align:center;min-width:0}
.daytitle h1{margin:0;font-size:20px;font-weight:700;line-height:1.1;display:flex;align-items:baseline;justify-content:center;gap:6px}
.daytitle h1 .num{font-size:58px;font-weight:700;color:var(--accent);line-height:.85}
.daytitle .sub{margin-top:8px;color:var(--muted);font-size:13.5px}
.status{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:999px;font-size:12.5px;line-height:1.75;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.mid{background:var(--now-soft);color:var(--now)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.ice{background:var(--ice-soft);color:var(--ice)}
.back-today{justify-self:center;border:0;background:var(--now-soft);color:var(--now);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:650}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:12px 10px;background:var(--bg)}
.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 0;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:inset 0 0 0 1px var(--line)}
main{display:grid;gap:24px}

/* now card */
.nowcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.nowcard .k{font-size:13px;font-weight:650;color:var(--now);letter-spacing:.04em}
.nowcard h2{margin:0;font-size:22px;line-height:1.2;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-wrap:balance}
.nowcard h2 .num{font-size:30px;font-weight:600;color:var(--muted)}
.nowcard.all{text-align:center;justify-items:center}
.nowcard.all .ring0{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.nowcard.all .ring0 svg{width:28px;height:28px}
.nowcard .hint .link{margin-left:6px;padding:0}
.itemlist{list-style:none;margin:0;padding:0;display:grid}
.itemlist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--line)}
.itemlist li:first-child{border-top:0}
.itemlist li>span:first-child{min-width:0}
.itemlist .dose{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700}

/* sections */
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:16px}
.sec-h .muted{font-size:12.5px}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.viewing{margin:0;padding:10px 14px;border-radius:12px;background:var(--now-soft);color:var(--ink);font-size:14px}

/* the day's rounds: a rail of dots */
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--sunk)}
.segs i.done{background:var(--accent)}
.segs i.part{background:var(--accent-soft)}
.segs i.late{background:var(--danger-soft)}
.rail{list-style:none;margin:0;padding:0}
.rr{display:grid;grid-template-columns:50px 40px 1fr;column-gap:6px;align-items:start;position:relative}
.rr:not(:last-child)::before{content:"";position:absolute;left:75px;top:42px;bottom:-4px;width:2px;background:var(--line)}
.rr .rt{font-size:21px;font-weight:600;padding-top:8px;color:var(--muted)}
.rr.due .rt{color:var(--now)}
.dot{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;padding:0;flex:none}
.dot svg{width:18px;height:18px}
.rr .dot{justify-self:center;margin-top:6px}
.dot.on,.rr.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rr.part .dot{border-color:var(--accent);background:linear-gradient(to top,var(--accent-soft) 50%,var(--surface) 50%)}
.rr.due .dot{border-color:var(--now);box-shadow:0 0 0 4px var(--now-soft)}
.rr.late .dot{border-color:var(--danger)}
.rr .rb{border:0;background:transparent;text-align:left;padding:8px 0 18px;display:grid;gap:3px;min-width:0}
.rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:650}
.rm{font-weight:400;font-size:12.5px;color:var(--muted)}
.rs{font-size:13px;color:var(--muted);line-height:1.65}
.rs i{font-style:normal;margin:0 5px;opacity:.5}
.rs span{white-space:nowrap}
.rr.done .rh{color:var(--muted)}

/* daily sessions */
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.dcard .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dcard h4{margin:0;font-size:16px}
.dcard .dm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.icebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ice-soft);border-radius:14px;padding:10px 12px}
.icebar .icen{font-size:30px;font-weight:700;color:var(--ice);line-height:1}
.icebar .btn{margin-left:auto;border-color:transparent;color:var(--ice)}

/* totals */
.tot{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tot .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.tot .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.tot .bar b{display:block;height:100%;background:var(--accent);border-radius:3px}
.tot .v{font-family:var(--f-num);font-size:20px;font-weight:600}
.tot .v small{font-family:var(--f-ui);font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}

/* pain scale (NRS 0–10) */
.nrs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px}
.nrs button{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-num);font-size:18px;font-weight:600;padding:0}
.nrs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nrs button.md.on{background:var(--now);border-color:var(--now);color:var(--surface)}
.nrs button.hi.on{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.next{display:grid;gap:4px;padding:14px 16px;border-radius:16px;background:var(--accent-soft)}
.next .k{font-size:12.5px;color:var(--accent);font-weight:650}
.next b{font-size:16px}
.next span:last-child{font-size:13.5px}
.foot{text-align:center;padding-inline:8px}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:58px 14px 1fr;column-gap:10px;position:relative;padding-bottom:20px}
.tl li:not(:last-child)::before{content:"";position:absolute;left:74px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl .d{text-align:right;font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.2}
.tl .d small{display:block;font-family:var(--f-ui);font-size:11.5px;font-weight:400;color:var(--muted)}
.tl .o{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--bg);margin-top:5px;position:relative;z-index:1}
.tl li.past .o{background:var(--accent);border-color:var(--accent)}
.tl li.cur .o{border-color:var(--now);background:var(--now);box-shadow:0 0 0 4px var(--now-soft)}
.tl .c{display:grid;gap:4px;min-width:0}
.tl .c b{font-size:15.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl .c p{margin:0;font-size:13.5px;color:var(--muted)}
.tl li.minor .c b{font-size:14px;font-weight:600}
.tl li.past .c{opacity:.65}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:grid;grid-template-columns:44px 52px minmax(0,1fr) 40px 44px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist .hd{font-size:16px;font-weight:600}
.hist .hp,.hist .hpn{color:var(--muted);font-size:12.5px}
.hist .hb{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.hist .hb b{display:block;height:100%;background:var(--accent)}
.hist .hv{text-align:right;font-size:16px}
.hist .hpn{text-align:right}

/* notes */
.alert{background:var(--danger-soft);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.alert h3{margin:0;color:var(--danger);font-size:16px}
.alert ol,.card ol,.card ul{margin:0;padding-left:20px;display:grid;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.card h3{margin:0;font-size:16px}
.card p{margin:0}
.card .btn{justify-self:start}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.ptable tr:first-child td{border-top:0}
.ptable td:first-child{width:9.6em;padding-right:10px}
.atable th{font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;padding:0 0 6px}
.atable td{padding-right:8px}
.atable td:first-child{width:5.4em}
.atable tr:first-child td{border-top:1px solid var(--line)}

/* settings */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow .sl{font-weight:600}
.srow .sr{grid-column:1;font-size:12px;color:var(--muted)}
.srow>:last-child:not(.sl):not(.sr){grid-row:1/span 2;grid-column:2}
.grp{font-size:12.5px;color:var(--accent);font-weight:650;letter-spacing:.06em;margin-top:10px}
.earlyq{display:grid;gap:10px;margin:2px 0 10px;padding:12px 14px;border-radius:14px;background:var(--now-soft)}
.earlyq p{margin:0;font-weight:600}
.earlyq-b{display:flex;flex-wrap:wrap;gap:8px}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.field input{font-family:var(--f-num);font-size:18px;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;padding:0 0 2px}
.stepper b{min-width:2.4ch;text-align:center;font-size:21px;font-weight:600}
.stepper .su{font-size:12.5px;color:var(--muted);min-width:2em}
.srow input{font-family:var(--f-num);font-size:18px;padding:5px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv>span{color:var(--muted);flex:none}
.kv>b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
/* first launch inside the app */
body.setup .hdr,body.setup .tabs{display:none}
.setup-card{display:grid;gap:16px;padding-top:6vh}
.setup-card h1{margin:0;font-size:30px;line-height:1.2;text-wrap:balance}
.setup-card .lead{margin:0;color:var(--muted);font-size:15px}
.setup-card .q{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.setup-card .q label{font-weight:650;font-size:17px}
.setup-card .q .srow{border-top:0;padding:0}
.setup-card .ql{font-weight:650;font-size:17px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{display:grid;gap:4px;text-align:left;padding:14px 14px 13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.kind b{font-size:18px}
.kind span{font-size:13px;color:var(--muted)}
.kind[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.setup-card .q input{font-family:var(--f-num);font-size:24px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:100%}
/* web version: how to open it, the alarm times, the Android app link */
.webtip{padding:12px 14px;border-radius:14px;background:var(--now-soft);color:var(--ink);font-size:14px;line-height:1.6}
.webtip>b{display:block;font-size:15.5px}
.webtip p{margin:4px 0 0}
.webtip .muted{font-size:13px}
.webtip a{color:var(--accent);font-weight:650}
.webtip .pw{letter-spacing:.5px}
.sec .webtip{margin-top:6px}
.alarms{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.alarms .chip{font-size:13.5px;padding:2px 10px}
.alarms .chip .num{font-size:16px;font-weight:600}
a.btn{display:inline-flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;white-space:nowrap}
.appbar{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:13px;line-height:1.5}
.appbar>div{flex:1;min-width:0}
.appbar b{display:block;font-size:14.5px}
.appbar span{color:var(--muted)}
.appbar .btn{min-height:38px;padding:7px 16px}
.appbar .x{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:6px 6px;cursor:pointer}
.setup-card .fine{text-align:center;margin-top:-4px}
.sw{position:relative;width:50px;height:30px;border-radius:999px;border:0;background:var(--sunk);padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}

/* coach overlay */
.player{position:fixed;inset:0;z-index:50;background:var(--p-bg);color:var(--p-ink);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player :focus-visible{outline-color:var(--p-amber)}
.p-top{display:flex;align-items:center;gap:8px;max-width:560px;width:100%;margin:0 auto}
.p-sess{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.p-sess b{font-size:15px;font-weight:650}
.p-sess b .num{font-size:18px;color:var(--p-muted);font-weight:500}
.p-step{font-size:14px;color:var(--p-muted)}
.p-pill{border:1px solid var(--p-line);background:transparent;color:var(--p-ink);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.p-pill[aria-pressed="false"]{color:var(--p-muted)}
.p-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--p-line);background:transparent;color:var(--p-ink);font-size:22px;line-height:1;padding:0 0 3px}
.p-body{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding-top:18px}

    case 'vtest': Demo.play(); break;
    case 'p-start': startTrack(P.idx); break;
    case 'p-go': startTrack(P.idx); break;
    case 'p-skipready': skipReady(); break;
    case 'p-pause': if (P.paused) resumeRun(); else pauseRun(); break;
    case 'p-next': skipItem(); break;
    case 'p-close': requestClose(); break;
    case 'p-end': P.confirm = false; closePlayer(); break;
    case 'p-cont': P.confirm = false; $('#pConfirm').hidden = true; if (P.state === 'run') resumeRun(); break;
    case 'p-donex': closePlayer(); break;
    case 'p-mark': toggleTick(P.date, P.sess.id, true); closePlayer(); break;
    case 'p-meth': S.st.method[ds.ex] = +ds.i; saveSettings(); drawPlayer(); break;
    case 'setup-remind': { const el = $('#setup-pod1'); if (el) S.setupPod1 = el.value; S.setupRemind = S.setupRemind === false; render(); break; }
    case 'setup-kind': { const el = $('#setup-pod1'); if (el) S.setupPod1 = el.value; S.setupKind = ds.k; render(); break; }
    case 'kind-ask': S.kindAsk = true; render(); break;
    case 'kind-no': S.kindAsk = false; render(); break;
    case 'apptip-off': try { localStorage.setItem(APPTIP_KEY, '1'); } catch (e) {} render(); toast('以后可以在「设置」→「提醒」里找到下载。'); break;
    case 'kind-go': setKind(S.st.kind === 'knee' ? 'ankle' : 'knee'); S.kindAsk = false; S.earlyAsk = null; S.view = null; saveSettings(); render(); toast('已换成' + PL().joint + '的计划。'); break;
    case 'setup-done': {
      const v = ($('#setup-pod1') || {}).value || '';
      if (!PLANS[S.setupKind]) { toast('先选一下做的是哪个手术'); break; }
      if (!/^\d{4}-\d\d-\d\d$/.test(v)) { toast('先选一下术后第一天的日期'); break; }
      setKind(S.setupKind); S.st.surgery = addDays(v, -1); S.st.setupDone = true; S.st.remind.on = S.setupRemind !== false;
      saveSettings(); S.tab = 'today'; S.view = null; render(); window.scrollTo(0, 0);
      if (S.st.remind.on && !nbJSON('info').notif) nb('requestNotif');
      syncReminders(true);
      break;
    }
    case 'remind': S.st.remind.on = !S.st.remind.on; saveSettings(); render(); if (S.st.remind.on && !nbJSON('info').notif) nb('requestNotif'); break;
    case 'remind-test': nb('testReminder'); toast('5秒后会收到一条测试通知。收不到的话，看看上面几项设置。', 5000); break;
    case 'perm-notif': { const inf = nbJSON('info'); if (inf.sdk >= 33 && !S.askedNotif) { S.askedNotif = true; nb('requestNotif'); } else nb('openNotifSettings'); break; }
    case 'open-notif': nb('openNotifSettings'); break;
    case 'open-battery': nb('openBattery'); break;
    case 'open-app': nb('openAppSettings'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'set-pod1') { if (/^\d{4}-\d\d-\d\d$/.test(t.value)) { S.st.surgery = addDays(t.value, -1); S.view = null; saveSettings(); render(); } }
  else if (t.id === 'set-daily') { if (/^\d\d:\d\d$/.test(t.value)) { S.st.remind.daily = t.value; saveSettings(); render(); } }
  else if (/^set-t\d$/.test(t.id)) {
    if (/^\d\d:\d\d$/.test(t.value)) { const ts = S.st.times.slice(); ts[+t.dataset.i] = t.value; ts.sort(); S.st.times = ts; saveSettings(); render(); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && P.on && !P.confirm) requestClose(); });
document.addEventListener('visibilitychange', () => {
  if (!P.on || P.state !== 'run' || P.engine !== 'speech') { if (!document.hidden && P.on && P.state === 'run') drawRun(clockNow()); return; }
  if (document.hidden) { const s = currentSeg(clockNow()); if (s && s.prog.mode !== 'time') pauseRun(); }
  else wake(true);
});
setInterval(tick, 150);
setInterval(() => { if (!P.on && S.tab === 'today' && !document.hidden) render(true); }, 30000);

const h0 = (location.hash || '').slice(1);
if (['today', 'plan', 'notes', 'settings'].includes(h0)) S.tab = h0;
applySettings();
Voice.init();
render();
Store.init().then(() => {
  S.ready = true;
  if (APP) { nativeOnLaunch(); render(true); window.__appOpen(); syncReminders(true); }
});
loadVoice();
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
